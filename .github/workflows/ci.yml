name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux
          - os: macos-latest
            label: macos
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.label }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Tauri npm/cargo version coupling
        run: bash scripts/check-tauri-version-coupling.sh

      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Lint frontend
        run: pnpm lint

      - name: Build frontend
        run: pnpm build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Run Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # Node, UI, and Rust tests run as independent steps so one failure does
      # not mask regressions in a later suite (pnpm test chains them with &&).
      - name: Run Node frontend tests
        run: pnpm test:node

      - name: Run UI frontend tests
        if: always()
        run: pnpm test:ui

      - name: Run Rust tests
        if: always()
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Verify the Tauri binary actually links on macOS — the dev/release CI
      # flows have skipped this in the past, so vibrancy, macos-private-api,
      # and window-state surfaces went unchecked until tag time.
      - name: Build Tauri binary (release)
        if: matrix.label == 'macos'
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --bin tunara

  # Real-SSH regression matrix: drives the production russh client against
  # Docker OpenSSH containers (auth methods, bash/zsh, host key TOFU/mismatch,
  # ProxyJump, passive disconnect + reconnect, SFTP on ~10k files, remote
  # grep latency). Fixture and runner live in tests/ssh-matrix/; details in
  # docs/TESTING.md ("Real SSH regression matrix").
  ssh-matrix:
    runs-on: ubuntu-22.04
    name: ssh-matrix (docker)
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ssh-matrix

      - name: Generate fixture client keys
        run: tests/ssh-matrix/keygen.sh

      # sshd only starts listening after the entrypoint has provisioned users
      # and the ~10k-file directory, so the containers finish booting while
      # the test binary compiles; run.sh waits for both ports before testing.
      - name: Start OpenSSH fixture (target + jump)
        run: docker compose -f tests/ssh-matrix/docker-compose.yml up -d --build

      - name: Compile matrix test binary
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --features ssh-matrix --no-run

      - name: Run real-SSH regression matrix
        run: tests/ssh-matrix/run.sh

      - name: Fixture logs
        if: failure()
        run: docker compose -f tests/ssh-matrix/docker-compose.yml logs --no-color

      - name: Tear down fixture
        if: always()
        run: docker compose -f tests/ssh-matrix/docker-compose.yml down -v --remove-orphans
